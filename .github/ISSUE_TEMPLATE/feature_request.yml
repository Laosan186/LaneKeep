name: Feature request / 功能建议
description: Explain the use case and desired behavior / 描述使用场景和期望行为
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case / 问题与场景
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope / 替代方案与影响范围
  - type: markdown
    attributes:
      value: "Please do not include personal addresses, nodes or credentials. 请勿包含真实地址、节点或凭据。"
